name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly run catches new RustSec advisories and lints from new stable releases.
    - cron: "0 6 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1
  # Docker Hub account used by the publish jobs to log in. Change it when pushing with a
  # personal account that has write access to the organization repository.
  DOCKERHUB_USERNAME: scorpioorganization
  IMAGE: scorpioorganization/scorpio-discord-bot
  # Last release before projects. The upgrade job migrates a database it created.
  LEGACY_IMAGE: scorpioorganization/scorpio-discord-bot:sha-b51d9a7

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - run: cargo clippy --all-targets --locked -- -D warnings

  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - run: cargo test --locked

  msrv:
    name: msrv
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Read rust-version from Cargo.toml
        id: msrv
        run: echo "version=$(sed -n 's/^rust-version = "\(.*\)"$/\1/p' Cargo.toml)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - run: cargo check --all-targets --locked

  deny:
    name: cargo-deny (${{ matrix.checks }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        checks:
          - advisories
          - bans licenses sources
    # A fresh advisory should not block unrelated pull requests. The weekly run still fails.
    continue-on-error: ${{ matrix.checks == 'advisories' && github.event_name != 'schedule' }}
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check ${{ matrix.checks }}

  docker:
    name: docker build and smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: scorpio-discord-bot:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Start container without a Discord token
        run: |
          docker run -d --name scorpio -p 127.0.0.1:8080:8080 \
            -e ROOT_PASSWORD=ci-root-password \
            scorpio-discord-bot:ci
      - name: Dashboard answers and root can sign in
        run: |
          # docker-proxy accepts and then resets connections until the app listens, so
          # retry on every error, not only refused connections.
          curl --fail --silent --show-error --retry 30 --retry-all-errors --retry-delay 1 \
            http://127.0.0.1:8080/healthz
          echo
          curl --fail --silent --show-error -o /dev/null http://127.0.0.1:8080/login
          status=$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --data 'username=root&password=ci-root-password' http://127.0.0.1:8080/login)
          test "$status" = 303 || { echo "login returned $status, expected 303"; exit 1; }
      - name: Container logs
        if: always()
        run: docker logs scorpio

  # Starts the last release before projects, gives its database the per server data of
  # ci/legacy_v6_seed.sql, then starts this build on the same data like the auto deploy does.
  upgrade:
    name: upgrade from the previous release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Shaped like a bot token. Discord rejects it, which the dashboard must survive.
      FAKE_TOKEN: MTExMTExMTExMTExMTExMTEx.Gaaaaa.bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
      HQ: "1187654321098765432"
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: scorpio-discord-bot:ci
          cache-from: type=gha
      - name: Create a database with the previous release
        run: |
          mkdir -p data
          docker run -d --name old --user "$(id -u):$(id -g)" -v "$PWD/data:/data" \
            -p 127.0.0.1:8080:8080 -e ROOT_PASSWORD=ci-root-password "$LEGACY_IMAGE"
          curl --fail --silent --show-error --retry 30 --retry-all-errors --retry-delay 1 \
            http://127.0.0.1:8080/healthz
          docker stop old
          docker logs old
          docker rm old
      - name: Add per server data
        run: |
          python3 - <<'PY'
          import sqlite3
          db = sqlite3.connect("data/scorpio.db")
          version = db.execute("SELECT MAX(version) FROM _sqlx_migrations").fetchone()[0]
          assert version == 6, f"previous release is at migration {version}, expected 6"
          db.executescript(open("ci/legacy_v6_seed.sql").read())
          db.commit()
          db.close()
          PY
      - name: Start this build on the same data
        run: |
          docker run -d --name new --user "$(id -u):$(id -g)" -v "$PWD/data:/data" \
            -p 127.0.0.1:8080:8080 -e ROOT_PASSWORD=ci-root-password \
            -e DISCORD_TOKEN="$FAKE_TOKEN" scorpio-discord-bot:ci
          curl --fail --silent --show-error --retry 30 --retry-all-errors --retry-delay 1 \
            http://127.0.0.1:8080/healthz
      - name: Settings moved into projects
        run: |
          set -x
          test -f data/scorpio.db.pre-v7.bak
          jar=$(mktemp)
          status=$(curl --silent --output /dev/null --write-out '%{http_code}' -c "$jar" \
            --data 'username=root&password=ci-root-password' http://127.0.0.1:8080/login)
          test "$status" = 303
          get() { curl --fail --silent --show-error -b "$jar" "http://127.0.0.1:8080$1"; }
          location=$(curl --silent --output /dev/null --write-out '%{redirect_url}' -b "$jar" \
            "http://127.0.0.1:8080/guilds/$HQ/modules/greeting")
          project=$(echo "$location" | sed -n 's|.*/projects/\([0-9]*\)/modules/greeting$|\1|p')
          test -n "$project"
          get "/projects/$project/modules/greeting" | grep -q 'Welcome {user} to {server}!'
          get "/projects/$project/modules/calendar" | grep -q 'Daily digest'
          get "/projects/$project/modules/discord" | grep -q 'Discord bot token'
          get / | grep -q "Discord server $HQ"
          python3 - <<'PY'
          import sqlite3
          db = sqlite3.connect("data/scorpio.db")
          one = lambda sql: db.execute(sql).fetchone()[0]
          assert one("SELECT MAX(version) FROM _sqlx_migrations") >= 7
          assert one("SELECT COUNT(*) FROM projects") == 3
          assert one("SELECT COUNT(*) FROM api_keys WHERE service = 'discord'") == 3
          assert one("SELECT COUNT(*) FROM project_modules WHERE module_id = 'discord' AND enabled = 1") == 3
          assert one("SELECT COUNT(*) FROM calendar_sent") == 2
          assert one("SELECT COUNT(*) FROM greeting_log") == 3
          assert one("SELECT COUNT(*) FROM recurring_done") == 1
          assert one("SELECT value FROM app_meta WHERE key = 'discord_env_imported'")
          PY
          docker logs new 2>&1 | grep -q 'moved DISCORD_TOKEN into the Discord module of 3 project'
      - name: Second start leaves the data alone
        run: |
          docker restart new
          curl --fail --silent --show-error --retry 30 --retry-all-errors --retry-delay 1 \
            http://127.0.0.1:8080/healthz
          docker logs new 2>&1 | grep -q 'DISCORD_TOKEN is set but no longer used'
          test "$(ls data/*.bak | wc -l)" = 1
      - name: Container logs
        if: always()
        run: docker logs new || true

  # Builds every platform on a native runner and pushes it by digest only. The
  # publish-manifest job tags the result, so nothing is tagged unless both platforms built.
  publish:
    name: publish image (${{ matrix.slug }})
    needs: [fmt, clippy, test, msrv, deny, docker, upgrade]
    if: github.ref == 'refs/heads/master' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      matrix:
        include:
          # Default gha cache scope, so this reuses the cache written by the docker job.
          - platform: linux/amd64
            runner: ubuntu-latest
            slug: amd64
            cache: buildkit
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            slug: arm64
            cache: arm64
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          tags: ${{ env.IMAGE }}
          outputs: type=image,push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.cache }}
          cache-to: type=gha,scope=${{ matrix.cache }},mode=max
      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.slug }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish-manifest:
    name: publish image manifest
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest
            type=sha
      - name: Create and push manifest list
        working-directory: ${{ runner.temp }}/digests
        run: |
          mapfile -t tags < <(jq -r '.tags[] | "--tag=" + .' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          refs=()
          for digest in *; do refs+=("$IMAGE@sha256:$digest"); done
          docker buildx imagetools create "${tags[@]}" "${refs[@]}"
      - name: Inspect pushed image
        run: docker buildx imagetools inspect "$IMAGE:latest"
