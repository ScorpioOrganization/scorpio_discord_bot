[package]
name = "scorpio-discord-bot"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
argon2 = "0.6"
askama = "0.16"
async-trait = "0.1"
axum = { version = "0.8", features = ["macros"] }
axum-extra = { version = "0.12", features = ["cookie"] }
dotenvy = "0.15"
hex = "0.4"
rand = "0.10"
serde = { version = "1", features = ["derive"] }
serde_urlencoded = "0.7"
serenity = { version = "0.12", default-features = false, features = ["builder", "cache", "client", "gateway", "http", "model", "utils", "rustls_backend"] }
sha2 = "0.11"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
subtle = "2"
thiserror = "2"
time = { version = "0.3", features = ["formatting", "macros"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.7", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
